<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>


<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="javascript:void(0)">Logo</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mynavbar">
      <ul class="navbar-nav me-auto">
          {%for c in cates %}
        <li class="nav-item">
          <a class="nav-link" href="/?cate_id={{c.id}}">{{ c.name }}</a>
        </li>
        {%endfor%}

      </ul>
      <form class="d-flex">
        <input class="form-control me-2" type="text" placeholder="Nhập từ khóa..." name="q">
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>


<div class="container-fluid mt-3">
  <h3>Navbar Forms</h3>
  <p>You can also include forms inside the navigation bar.</p>
</div>


<body>
  <div class="row">
    {%for p in prods%}
    <div class="col-md-3 col-12">
        <div class="card" style="width:400px">
      <img class="card-img-top" src="{{p.image}}" alt="{{p.name}}">
      <div class="card-body">
        <h4 class="card-title">{{p.name}}</h4>
        <p class="card-text">{{p.price}}</p>
        <a href="#" class="btn btn-primary">XEM CHI TIET </a>
        <a href="#" class="btn btn-primary">DAT HANG</a>

      </div>
    </div>

    </div>
    {%endfor%}
  </div>



</body>
</html>
